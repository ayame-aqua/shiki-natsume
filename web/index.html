<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>四季夏目</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@1.2.0/dist/index.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div id="live2d-container" class="live2d-container">
        <canvas id="live2d-canvas"></canvas>
      </div>
      <main class="app">
        <header class="brand">
          <span id="character-name">四季夏目</span>
          <a class="memory-link" href="/memory">记忆</a>
        </header>
        <section id="messages" class="messages" aria-live="polite"></section>
        <footer class="composer">
          <textarea id="input" rows="2" placeholder="跟她说点什么…"></textarea>
          <button id="live" type="button">对话</button>
          <button id="send" type="button">发送</button>
        </footer>
        <p id="status" class="status">连接中…</p>
        <p id="vad-meter" class="vad-meter" hidden>音量 --</p>
      </main>
    </div>
    <script src="/assets/live2d.js"></script>
    <script src="/assets/app.js"></script>
  </body>
</html>
